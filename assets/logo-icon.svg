<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#181221"/>
      <stop offset="1" stop-color="#0a0810"/>
    </linearGradient>
  </defs>

  <!-- badge background -->
  <rect x="6" y="6" width="228" height="228" rx="46" fill="url(#bg)"/>
  <rect x="6.5" y="6.5" width="227" height="227" rx="45.5" fill="none" stroke="#2a2333" stroke-width="1"/>

  <!-- package outline: left edge, top-left corner, top edge, top-right corner, right edge -->
  <path d="M 64 162
           L 64 78
           A 14 14 0 0 1 78 64
           L 162 64
           A 14 14 0 0 1 176 78
           L 176 150"
        fill="none" stroke="#ff3fa4" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- bottom edge + bottom-left corner (bottom-right corner deliberately left open) -->
  <path d="M 150 176
           L 78 176
           A 14 14 0 0 1 64 162"
        fill="none" stroke="#ff3fa4" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- interior "contents revealed" lines -->
  <line x1="84" y1="96" x2="116" y2="96" stroke="#ff3fa4" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round"/>
  <line x1="84" y1="116" x2="104" y2="116" stroke="#ff3fa4" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round"/>

  <!-- unraveling thread, strand 1: trails from the open corner's right-edge end -->
  <line x1="176" y1="150" x2="190" y2="158" stroke="#35e6c4" stroke-opacity="0.9" stroke-width="7" stroke-linecap="round"/>
  <line x1="190" y1="158" x2="182" y2="168" stroke="#35e6c4" stroke-opacity="0.72" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="182" y1="168" x2="198" y2="178" stroke="#35e6c4" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
  <line x1="198" y1="178" x2="188" y2="190" stroke="#35e6c4" stroke-opacity="0.4" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="188" y1="190" x2="204" y2="198" stroke="#35e6c4" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round"/>
  <circle cx="204" cy="198" r="5" fill="#35e6c4" fill-opacity="0.28"/>

  <!-- unraveling thread, strand 2: trails from the open corner's bottom-edge end -->
  <line x1="150" y1="176" x2="162" y2="188" stroke="#35e6c4" stroke-opacity="0.7" stroke-width="6" stroke-linecap="round"/>
  <line x1="162" y1="188" x2="152" y2="200" stroke="#35e6c4" stroke-opacity="0.4" stroke-width="5" stroke-linecap="round"/>
  <circle cx="152" cy="200" r="4" fill="#35e6c4" fill-opacity="0.4"/>

  <!-- anchor dots at the two points the box came loose -->
  <circle cx="176" cy="150" r="6" fill="#ff3fa4"/>
  <circle cx="150" cy="176" r="6" fill="#ff3fa4"/>
</svg>
