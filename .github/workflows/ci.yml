name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Syntax-check source files
        run: |
          for f in $(find bin src -name "*.js"); do
            node --check "$f"
          done

      - name: CLI boots and shows help
        run: node bin/apk-unravel.js --help

      - name: doctor command runs without crashing
        run: node bin/apk-unravel.js doctor || true
